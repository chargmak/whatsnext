<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/icon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- PWA Meta Tags -->
  <meta name="theme-color" content="#141415" />
  <meta name="description"
    content="Track your favorite movies and TV shows with What's Next? - Your personal entertainment companion." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="What's Next?" />

  <!-- Warm up the connections the first screen needs. The browser opens these
       (DNS + TCP + TLS) while the bundle is still downloading, so the trending
       request and the first posters don't pay for a cold handshake. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://api.themoviedb.org" />
  <link rel="preconnect" href="https://image.tmdb.org" />

  <!-- Fonts are linked here, not @import-ed from index.css: an @import isn't
       discovered until the stylesheet has downloaded and parsed, which puts a
       second render-blocking round trip in front of the first paint. -->
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" />

  <!-- Manifest -->
  <link rel="manifest" href="/manifest.json" />

  <!-- Apple Touch Icon (iOS requires PNG) -->
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

  <title>What's Next?</title>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
